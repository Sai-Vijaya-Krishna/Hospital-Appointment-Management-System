<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Register - City Hospital</title><link rel="stylesheet" href="/css/style.css"/></head>
<body>
<nav class="navbar"><a href="/" class="brand">🏥 City Hospital</a>
  <div class="nav-links"><a href="/auth/login.html">Login</a></div>
</nav>
<div class="form-box" style="max-width:520px">
  <h2>🏥 Create Account</h2>
  <div id="msg"></div>
  <div class="form-row">
    <div class="form-group"><label>Full Name *</label><input type="text" id="name" placeholder="Your full name"/></div>
    <div class="form-group"><label>Email *</label><input type="email" id="email" placeholder="Email address"/></div>
  </div>
  <div class="form-row">
    <div class="form-group"><label>Password *</label><input type="password" id="password" placeholder="Create password"/></div>
    <div class="form-group"><label>Phone</label><input type="text" id="phone" placeholder="Phone number"/></div>
  </div>
  <div class="form-row">
    <div class="form-group"><label>Age</label><input type="number" id="age" placeholder="Your age"/></div>
    <div class="form-group"><label>Blood Group</label>
      <select id="bloodGroup">
        <option value="">Select</option>
        <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
        <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
      </select>
    </div>
  </div>
  <button class="form-submit" onclick="register()">Create Account</button>
  <div class="form-link">Already registered? <a href="/auth/login.html">Login here</a></div>
</div>
<script>
async function register() {
  const name=document.getElementById('name').value, email=document.getElementById('email').value;
  const password=document.getElementById('password').value, phone=document.getElementById('phone').value;
  const age=document.getElementById('age').value, bloodGroup=document.getElementById('bloodGroup').value;
  if (!name||!email||!password) { showMsg('Name, email and password are required','error'); return; }
  const res  = await fetch('/api/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name,email,password,phone,age,bloodGroup}) });
  const data = await res.json();
  if (data.token) {
    localStorage.setItem('token',data.token); localStorage.setItem('role',data.role);
    localStorage.setItem('name',data.name);   localStorage.setItem('email',data.email);
    showMsg('Account created! Redirecting...','success');
    setTimeout(()=>window.location.href='/patient/doctors.html',1500);
  } else { showMsg(data.error||'Registration failed','error'); }
}
function showMsg(m,t){ document.getElementById('msg').innerHTML=`<div class="alert alert-${t}">${m}</div>`; }
</script>
</body></html>
