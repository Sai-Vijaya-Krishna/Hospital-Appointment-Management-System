<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Admin Dashboard - City Hospital</title><link rel="stylesheet" href="/css/style.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script></head>
<body>
<div class="admin-layout">
  <div class="sidebar">
    <div class="brand">🏥 Admin Panel</div>
    <a href="/admin/dashboard.html" class="active">📊 Dashboard</a>
    <a href="/admin/appointments.html">📋 Appointments</a>
    <a href="/admin/doctors.html">👨‍⚕️ Doctors</a>
    <a href="/admin/departments.html">🏥 Departments</a>
    <a href="/admin/patients.html">👥 Patients</a>
    <a href="#" onclick="logout()">🚪 Logout</a>
  </div>
  <div class="main-content">
    <h1 style="margin-bottom:4px">Dashboard</h1>
    <p style="color:#888;font-size:.85rem;margin-bottom:24px" id="dateInfo"></p>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num" id="totalAppts">-</div><div class="stat-label">Total Appointments</div></div>
      <div class="stat-card"><div class="stat-num" id="todayAppts">-</div><div class="stat-label">Today's Appointments</div></div>
      <div class="stat-card"><div class="stat-num" id="totalDocs">-</div><div class="stat-label">Doctors</div></div>
      <div class="stat-card"><div class="stat-num" id="totalPatients">-</div><div class="stat-label">Patients</div></div>
      <div class="stat-card"><div class="stat-num" id="completed">-</div><div class="stat-label">Completed</div></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px">
      <div style="background:#fff;padding:22px;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.08)">
        <h3 style="margin-bottom:14px;font-size:.95rem">Appointments Overview</h3>
        <canvas id="barChart" height="200"></canvas>
      </div>
      <div style="background:#fff;padding:22px;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.08)">
        <h3 style="margin-bottom:14px;font-size:.95rem">Status Distribution</h3>
        <canvas id="pieChart" height="200"></canvas>
      </div>
    </div>

    <div style="background:#fff;padding:22px;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.08)">
      <h3 style="margin-bottom:16px">Recent Appointments</h3>
      <table class="tbl">
        <thead><tr><th>Patient</th><th>Doctor</th><th>Department</th><th>Date</th><th>Status</th></tr></thead>
        <tbody id="recentBody"></tbody>
      </table>
    </div>
  </div>
</div>
<script>
const token=localStorage.getItem('token'),role=localStorage.getItem('role');
if(!token||role!=='ADMIN') window.location.href='/auth/login.html';
document.getElementById('dateInfo').textContent=new Date().toDateString()+' · Admin: '+localStorage.getItem('name');

async function load() {
  const res=await fetch('/api/admin/dashboard',{headers:{'Authorization':'Bearer '+token}});
  const d=await res.json();
  document.getElementById('totalAppts').textContent=d.totalAppointments;
  document.getElementById('todayAppts').textContent=d.todayAppointments;
  document.getElementById('totalDocs').textContent=d.totalDoctors;
  document.getElementById('totalPatients').textContent=d.totalPatients;
  document.getElementById('completed').textContent=d.completed;

  document.getElementById('recentBody').innerHTML =
    (d.recentAppointments || []).map(a => `
      <tr>
        <td>${a.patientName || '--'}</td>
        <td>${a.doctorName  || '--'}</td>
        <td>${a.department  || '--'}</td>
        <td>${a.date        || '--'}</td>
        <td><span class="badge badge-${a.status?.toLowerCase()}">${a.status}</span></td>
      </tr>`).join('');

  new Chart(document.getElementById('barChart'),{type:'bar',data:{
    labels:['Total','Today','Confirmed','Completed'],
    datasets:[{label:'Count',data:[d.totalAppointments,d.todayAppointments,d.confirmedToday,d.completed],backgroundColor:['#1565c0','#1976d2','#2196f3','#4caf50'],borderRadius:6}]
  },options:{responsive:true,plugins:{legend:{display:false}}}});

  new Chart(document.getElementById('pieChart'),{type:'doughnut',data:{
    labels:['Confirmed','Completed','Today'],
    datasets:[{data:[d.confirmedToday,d.completed,d.todayAppointments],backgroundColor:['#2196f3','#4caf50','#f7931e']}]
  },options:{responsive:true}});
}
function logout(){localStorage.clear();window.location.href='/auth/login.html';}
load();
</script>
</body></html>
